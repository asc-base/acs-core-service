name: Deploy staging

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  IMAGE_TAG: staging-${{ github.sha }}

concurrency:
  group: deploy-staging
  cancel-in-progress: true

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dockerfile
          target: staging
          push: true
          tags: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-infrastructure:
    name: Update staging infrastructure
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Checkout infrastructure repository
        uses: actions/checkout@v4
        with:
          repository: asc-base/acs-website-infra
          ref: main
          token: ${{ secrets.ACS_WEBSITE_INFRA_TOKEN }}
          path: infrastructure

      - name: Update core-service image version
        working-directory: infrastructure
        run: |
          set -euo pipefail

          compose_file="staging/core-service/docker-compose.yml"
          image="${IMAGE}:${IMAGE_TAG}"

          if ! grep -q '^    image: ghcr.io/asc-base/acs-core-service:' "$compose_file"; then
              echo "Expected core-service image was not found in $compose_file"
              exit 1
          fi

          sed -i -E "s|^    image: ghcr.io/asc-base/acs-core-service:.*$|    image: ${image}|" "$compose_file"

          if git diff --quiet -- "$compose_file"; then
              echo "Staging infrastructure already references $image"
              exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$compose_file"
          git commit -m "chore(staging): deploy core-service ${GITHUB_SHA::7}"
          git push origin HEAD:main

  deploy:
    name: Deploy to staging
    needs: update-infrastructure
    runs-on: ubuntu-latest
    environment:
      name: staging

    steps:
      - name: Trigger Dokploy deployment
        env:
          DOKPLOY_WEBHOOK_URL: ${{ secrets.DOKPLOY_STAGING_WEBHOOK_URL }}
        run: |
          if [ -z "$DOKPLOY_WEBHOOK_URL" ]; then
              echo "DOKPLOY_STAGING_WEBHOOK_URL is not configured."
              exit 1
          fi

          curl --fail --show-error --silent \
              --request POST \
              "$DOKPLOY_WEBHOOK_URL"
